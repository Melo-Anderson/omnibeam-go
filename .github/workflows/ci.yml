name: Continuous Integration & Architecture Governance

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint-and-governance:
    name: Lint & Architectural Bounds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Verify Module Hygiene & Formatting
        run: |
          go mod tidy
          gofmt -w .
          git diff --exit-code

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  unit-and-property-tests:
    name: Tests & Coverage Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Run Unit, Property & Regression Checks
        run: |
          go test -v -short -p 1 -race -coverprofile=coverage.out -covermode=atomic ./pkg/... ./internal/... ./cmd/... ./tests/property/...
          go tool cover -func=coverage.out

      - name: Run Hot-Path Performance Benchmarks
        run: |
          go test -bench=. -benchmem -run=^$ ./internal/domain/... ./internal/adapters/streams/codecs/compression/... ./internal/beam/streams/...
