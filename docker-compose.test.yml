services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: testdb
    volumes:
      - ./testdata/docker/postgres_init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 2s
      timeout: 3s
      retries: 15

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: testpassword
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpassword
    volumes:
      - ./testdata/docker/mysql_init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "testuser", "-ptestpassword"]
      interval: 2s
      timeout: 3s
      retries: 15

  fake-gcs-server:
    image: fsouza/fake-gcs-server:latest
    container_name: test-gcs
    command:
      - "-scheme"
      - "http"
      - "-public-host"
      - "127.0.0.1:4443"
      - "-external-url"
      - "http://127.0.0.1:4443"
      - "-backend"
      - "memory"
    ports:
      - "4443:4443"

  openbao:
    image: openbao/openbao:latest
    container_name: test-openbao
    environment:
      BAO_DEV_ROOT_TOKEN_ID: testtoken
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      BAO_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 2s
      timeout: 3s
      retries: 15

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: test-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger Web UI

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: test-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./testdata/docker/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver (Host -> Collector)
      - "4318:4318" # OTLP HTTP receiver (Host -> Collector)
      - "8889:8889" # Prometheus metrics exporter (scraped by Prometheus)
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: test-prometheus
    volumes:
      - ./testdata/docker/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: test-grafana
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./testdata/docker/grafana/provisioning:/etc/grafana/provisioning
      - ./testdata/docker/grafana/dashboards:/etc/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  e2e-happy-path:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/opt/dataflow/pipeline"]
    environment:
      - STORAGE_EMULATOR_HOST=fake-gcs-server:4443
    depends_on:
      - fake-gcs-server
    volumes:
      - ./testdata/fixtures:/workspace/testdata/fixtures:ro
      - ./testdata/configs:/workspace/testdata/configs:ro
      - ./testdata/output/e2e_01:/workspace/testdata/output/e2e_01
    working_dir: /workspace
    command: ["--config", "/workspace/testdata/configs/manifest_happy_path.json"]

  e2e-compressed-latin1:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/opt/dataflow/pipeline"]
    environment:
      - STORAGE_EMULATOR_HOST=fake-gcs-server:4443
    depends_on:
      - fake-gcs-server
    volumes:
      - ./testdata/fixtures:/workspace/testdata/fixtures:ro
      - ./testdata/configs:/workspace/testdata/configs:ro
      - ./testdata/output/e2e_02:/workspace/testdata/output/e2e_02
    working_dir: /workspace
    command: ["--config", "/workspace/testdata/configs/manifest_compressed_latin1.json"]

  e2e-dlq-quarantine:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/opt/dataflow/pipeline"]
    environment:
      - STORAGE_EMULATOR_HOST=fake-gcs-server:4443
    depends_on:
      - fake-gcs-server
    volumes:
      - ./testdata/fixtures:/workspace/testdata/fixtures:ro
      - ./testdata/configs:/workspace/testdata/configs:ro
      - ./testdata/output/e2e_03:/workspace/testdata/output/e2e_03
    working_dir: /workspace
    command: ["--config", "/workspace/testdata/configs/manifest_dlq_quarantine.json"]

